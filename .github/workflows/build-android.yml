# ===== File: .github/workflows/build-android.yml =====
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  buildAndroid:
    name: Build for Android 📱
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity Android Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: LanGame.EditorTools.BuildScript.BuildAndroidFromCommandLine
          customParameters: -customBuildPath Builds/Android/LanPartyArcade.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanPartyArcade-APK
          path: Builds/Android/LanPartyArcade.apk
