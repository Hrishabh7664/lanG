plugins {
    id 'com.android.application'
}

android {
    namespace 'com.langamestudio.lanpartyarcade'
    compileSdk 34

    defaultConfig {
        applicationId 'com.langamestudio.lanpartyarcade'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('ANDROID_KEY_ALIAS')
            def keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                setStoreFile(file(keystorePath))
                setStorePassword(keystorePassword)
                setKeyAlias(keyAlias)
                setKeyPassword(keyPassword)
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation project(':games:ink-arena')
    implementation project(':games:jetfire')
    implementation project(':games:racer3d')
}
